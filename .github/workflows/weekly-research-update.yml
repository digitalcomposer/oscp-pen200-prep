name: Weekly Research Update

on:
  schedule:
    # Run every Sunday at 11 PM UTC
    - cron: '0 23 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-research:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run GitHub scraper
        run: python3 advanced_scraper.py
        continue-on-error: true

      - name: Run Reddit scraper
        run: python3 reddit_scraper.py
        continue-on-error: true

      - name: Commit and push updates
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore: Update research findings (GitHub + Reddit)"
          file_pattern: |
            *_findings.md
            *_findings.json
            OSCP-PEN200-Vault/13-Latest-Research/
          commit_options: '--no-verify'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
