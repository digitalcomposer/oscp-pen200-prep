                difficulty: "high",
                links: "Windows-Privesc.md"
            },
            "ad-exploitation": {
                phase: 6,
                time: "~60-120 min",
                description: "Active Directory exploitation (Kerberoasting, DCSync, etc.)",
                tools: ["Impacket", "Mimikatz", "BloodHound", "PowerView"],
                commands: ["GetUserSPNs.py", "secretsdump.py", "Invoke-Kerberoast"],
                difficulty: "critical",
                links: "Active-Directory.md"
            }
        };

        // ===================== D3.JS VISUALIZATION =====================
        let simulation = null;
        let svg = null;
        let width = document.querySelector('.canvas').clientWidth;
        let height = document.querySelector('.canvas').clientHeight;
        let physicsEnabled = true;

        function initVisualization() {
            const container = document.getElementById('graph');
            container.innerHTML = '';

            svg = d3.select('#graph')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            // Add zoom
            const g = svg.append('g');
            svg.call(d3.zoom().on('zoom', (event) => {
                g.attr('transform', event.transform);
            }));

            // Create force simulation
            simulation = d3.forceSimulation(killChainData.nodes)
                .force('link', d3.forceLink(killChainData.links)
                    .id(d => d.id)
                    .distance(100)
                    .strength(0.5))
                .force('charge', d3.forceManyBody().strength(-300))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide(30));

            // Create links
            const link = g.append('g')
                .selectAll('line')
                .data(killChainData.links)
                .join('line')
                .attr('class', d => `phase${d.phase}`)
                .style('stroke-width', 2);

            // Create nodes
            const node = g.append('g')
                .selectAll('circle')
                .data(killChainData.nodes)
                .join('circle')
                .attr('r', d => {
                    if (d.type === 'phase') return 25;
                    if (d.type === 'decision' || d.type === 'warning') return 20;
                    return 15;
                })
                .attr('fill', d => d.color)
                .attr('stroke', '#00ff41')
                .attr('stroke-width', 2)
                .call(drag(simulation))
                .on('click', (event, d) => showNodeInfo(d));

            // Create labels
            const labels = g.append('g')
                .selectAll('text')
                .data(killChainData.nodes)
                .join('text')
                .attr('class', 'node-label')
                .attr('text-anchor', 'middle')
                .attr('dy', '0.3em')
                .text(d => {
                    if (d.type === 'phase') return d.name.split(' ')[0];
                    return d.name.substring(0, 12);
                })
                .style('font-size', d => d.type === 'phase' ? '12px' : '9px');

            // Update positions
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);

                node
                    .attr('cx', d => d.x = Math.max(30, Math.min(width - 30, d.x)))
                    .attr('cy', d => d.y = Math.max(30, Math.min(height - 30, d.y)));

                labels
                    .attr('x', d => d.x)
                    .attr('y', d => d.y);
            });

            // Update stats
            document.getElementById('totalNodes').textContent = killChainData.nodes.length;
            document.getElementById('totalLinks').textContent = killChainData.links.length;
        }

        function drag(simulation) {
            function dragStarted(event, d) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                d.fx = d.x;
                d.fy = d.y;
            }

            function dragged(event, d) {
                d.fx = event.x;
                d.fy = event.y;
            }

            function dragEnded(event, d) {
                if (!event.active) simulation.alphaTarget(0);
                d.fx = null;
                d.fy = null;
            }

            return d3.drag()
                .on('start', dragStarted)
                .on('drag', dragged)
                .on('end', dragEnded);
        }

        function showNodeInfo(node) {
            const infoContainer = document.getElementById('infoContainer');
            const emptyState = document.getElementById('emptyState');
            const info = nodeInfo[node.id];

            if (!info) {
                infoContainer.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            let html = `
                <div class="info-panel active">
                    <div class="info-title">${node.name}</div>

                    <div class="phase-indicator" style="border-left-color: ${node.color}">
                        <div class="info-label">Phase ${node.phase}</div>
                        <div class="phase-time">${info.time}</div>
                    </div>

                    <div class="info-section">
                        <div class="info-label">Description</div>
                        <div class="info-content">${info.description}</div>
                    </div>
            `;

            if (info.difficulty) {
                const diffClass = info.difficulty === 'critical' ? 'difficulty-high' :
                                info.difficulty === 'hard' ? 'difficulty-high' :
                                info.difficulty === 'medium' ? 'difficulty-medium' : 'difficulty-low';
                html += `
                    <div class="info-section">
                        <div class="info-label">Difficulty</div>
                        <div class="${diffClass}">${info.difficulty.toUpperCase()}</div>
                    </div>
                `;
            }

            if (info.success_rate) {
                html += `
                    <div class="info-section">
                        <div class="info-label">Success Rate</div>
                        <div class="info-content">${info.success_rate}</div>
                    </div>
                `;
            }

            if (info.tools) {
                html += `
                    <div class="info-section">
                        <div class="info-label">Tools</div>
                        <div>${info.tools.map(t => `<div class="tool-tag">${t}</div>`).join('')}</div>
                    </div>
                `;
            }

            if (info.commands) {
                html += `
                    <div class="info-section">
                        <div class="info-label">Example Commands</div>
                        ${info.commands.map(cmd => `<div class="command-block" onclick="copyCommand(this)">${cmd}</div>`).join('')}
                    </div>
                `;
            }

            if (info.links) {
                html += `
                    <div class="info-section">
                        <div class="info-label">📖 Related Note</div>
                        <div class="info-content">${info.links}</div>
                    </div>
                `;
            }

            if (node.type === 'warning' || node.type === 'decision') {
                html += `
                    <div class="warning">
                        ⚠️ ${info.impact || 'Critical decision point'}
                    </div>
                `;
            }

            html += `</div>`;
            infoContainer.innerHTML = html;
        }

        function copyCommand(element) {
            const text = element.textContent;
            navigator.clipboard.writeText(text).then(() => {
                element.style.background = 'rgba(0, 255, 65, 0.3)';
                setTimeout(() => {
                    element.style.background = 'rgba(0, 0, 0, 0.7)';
                }, 500);
            });
        }

        function resetView() {
            if (simulation) {
                simulation.restart();
            }
            initVisualization();
        }

        function togglePhysics() {
            physicsEnabled = !physicsEnabled;
            if (physicsEnabled) {
                simulation.alpha(0.3).restart();
            } else {
                simulation.stop();
            }
        }

        function zoomToFit() {
            const bounds = svg.node().getBBox();
            const fullWidth = bounds.width;
            const fullHeight = bounds.height;
            const midX = bounds.x + fullWidth / 2;
            const midY = bounds.y + fullHeight / 2;

            const scale = 0.8 / Math.max(fullWidth / width, fullHeight / height);
            const translate = [width / 2 - scale * midX, height / 2 - scale * midY];

            svg.transition().duration(750).call(
                d3.zoom().transform,
                d3.zoomIdentity.translate(translate[0], translate[1]).scale(scale)
            );
        }

        // Initialize on load
        window.addEventListener('load', () => {
            initVisualization();
            zoomToFit();
        });

        // Handle window resize
        window.addEventListener('resize', () => {
            width = document.querySelector('.canvas').clientWidth;
            height = document.querySelector('.canvas').clientHeight;
            resetView();
        });
    </script>
</body>
</html>
